name: Vertex Agent CMake CI

on:
  push:
    branches: ["main"]
    paths:
      - "vertex-agent/**"
      - ".github/workflows/cmake-multi-platform.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "vertex-agent/**"
      - ".github/workflows/cmake-multi-platform.yml"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake
          -S ${{ github.workspace }}/vertex-agent
          -B ${{ github.workspace }}/vertex-agent/build
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          cmake
          --build ${{ github.workspace }}/vertex-agent/build
          --config Release

      - name: Test
        working-directory: ${{ github.workspace }}/vertex-agent/build
        run: ctest --build-config Release --output-on-failure
