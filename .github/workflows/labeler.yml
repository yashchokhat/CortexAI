name: PR Labeler

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Label PR
    runs-on: ubuntu-latest

    steps:
      - name: Label PR by paths changed
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
