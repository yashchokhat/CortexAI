name: Vertex Agent CI

on:
  push:
    branches:
      - main
    paths:
      - "vertex-agent/**"
      - ".github/workflows/vertex-agent.yml"

  pull_request:
    branches:
      - main
    paths:
      - "vertex-agent/**"
      - ".github/workflows/vertex-agent.yml"

jobs:
  build:
    name: Build edge_agent (ESP-IDF v5.3)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        working-directory: vertex-agent/application/edge_agent
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          pip install --no-cache-dir esp-bmgr-assist || pip install --break-system-packages --no-cache-dir esp-bmgr-assist
          idf.py bmgr -c ./boards -b anyboard
          idf.py build
